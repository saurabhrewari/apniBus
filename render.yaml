services:
  - type: web
    name: apnibus
    env: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: REQUIRE_AUTH
        value: true
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_MAX
        value: 180
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: BUS_OFFLINE_AFTER_MS
        value: 180000
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGINS
        value: https://apnibus-fuao.onrender.com
